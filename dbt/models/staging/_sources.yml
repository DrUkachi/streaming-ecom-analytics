version: 2

sources:
  - name: kafka
    description: >
      Raw e-commerce events streamed by the Python Kafka producer into Confluent
      Cloud and landed in Snowflake by the Confluent Snowflake Sink Connector.
    database: "{{ target.database }}"
    # Where the Snowflake Sink Connector lands the raw Kafka events.
    schema: "{{ env_var('DBT_RAW_SCHEMA', 'RAW') }}"
    tables:
      - name: ecommerce_events
        identifier: "{{ env_var('DBT_RAW_EVENTS_TABLE', 'VIEW_KAFKA_ECOMMERCE_STREAM') }}"
        description: One row per user event (view, cart or purchase), as produced to the `kafka_ecommerce_stream` topic.
        loaded_at_field: create_time
        freshness:
          # The Airflow DAG streams a new batch every 3 hours.
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
        columns:
          - name: event_time
            description: When the event happened (UTC).
            tests:
              - not_null
          - name: event_type
            description: One of view, cart, purchase.
            tests:
              - not_null
          - name: product_id
            tests:
              - not_null
          - name: user_id
            tests:
              - not_null
          - name: user_session
            tests:
              - not_null
          - name: create_time
            description: When the sink connector wrote the row to Snowflake. Used for freshness checks.
